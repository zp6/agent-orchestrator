proxy:
  url: "http://localhost:3457"
  manager_url: "http://localhost:3400"
  timeout_ms: 300000
  ssh_key: "~/.ssh/claude-proxy-agents"

base_dir: "/Users/paultarr/Documents/Git"
orchestrator_dir: "/Users/paultarr/Documents/Git/claude-agent-orchestrator"

verification:
  enabled: true
  sources: ["github", "linear"]
  min_score: 0.7

agents:
  orchestrator-llm:
    dir: "claude-agent-orchestrator"
    description: "Dedicated LLM container for orchestrator operations (routing, reviewing, verifying, supervising). Not for dispatched work."
    capabilities: ["llm", "orchestration"]
    owns_topics: []
    docker:
      port: 3470
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "fresh"

  claude-proxy:
    dir: "claude-proxy"
    description: "Development proxy server that wraps Claude Code CLI instances and exposes them via the Anthropic Messages API. Manages agent containers, Docker lifecycle, and multi-agent routing."
    capabilities: ["typescript", "docker", "proxy", "api", "infrastructure"]
    github: "rapartlu/claude-proxy"
    owns_topics: ["proxy", "docker", "container", "infrastructure", "auth", "ssh"]
    docker:
      port: 3471
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "fresh"

  hermitcraft-agent:
    dir: "hermitcraft-agent"
    description: "Self-learning Hermitcraft knowledge agent — researches, organizes, and maintains a comprehensive knowledge base about the Hermitcraft Minecraft SMP"
    capabilities: ["research", "web-search", "knowledge-base", "minecraft", "hermitcraft"]
    github: "rapartlu/agent-hermitcraft"
    owns_topics: ["hermitcraft", "minecraft", "hermits", "smp"]
    docker:
      port: 3469
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  cheese-hater:
    dir: "cheese-hater"
    description: "The ultimate cheese-hating agent — rates, reviews, and dismantles every argument for cheese"
    capabilities: ["testing", "cheese-hatred", "express", "api"]
    github: "rapartlu/cheese-hater"
    owns_topics: ["test", "cheese"]
    docker:
      port: 3457
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"
