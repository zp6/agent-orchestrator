proxy:
  url: "http://localhost:3457"
  manager_url: "http://localhost:3400"
  timeout_ms: 900000
  ssh_key: "~/.ssh/claude-proxy-agents"
  # gh_token loaded from GH_TOKEN env var at runtime

base_dir: "/Users/paultarr/Documents/Git"
orchestrator_dir: "/Users/paultarr/Documents/Git/claude-agent-orchestrator"

verification:
  enabled: true
  sources: ["github", "linear"]
  min_score: 0.7
  max_revisions: 1  # revision cycles before giving up (0 = verify-only)

agents:
  claude-agent-orchestrator:
    dir: "claude-agent-orchestrator"
    repo: "git@github.com:rapartlu/claude-agent-orchestrator.git"
    description: "Core orchestration infrastructure: daemon loop, state store, task dispatching, trigger polling, agent deployment, and sync. Does NOT own dashboard/CLI UI or PR review/verification quality layer — those belong to the dashboard and reviewer agents."
    capabilities: ["typescript", "orchestration", "sqlite"]
    github: "rapartlu/claude-agent-orchestrator"
    owns_topics: ["orchestrator", "daemon", "routing", "dispatcher", "planner", "deployer", "state", "triggers", "sync"]
    docker:
      port: 3472
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  claude-orchestrator-dashboard:
    dir: "claude-orchestrator-dashboard"
    repo: "git@github.com:rapartlu/claude-orchestrator-dashboard.git"
    description: "Dashboard, CLI commands, and observability UI for the orchestrator. Owns all user-facing interfaces: web dashboard, status/health/metrics commands, activity views, escalation queue."
    capabilities: ["typescript", "html", "css", "express", "dashboard"]
    github: "rapartlu/claude-orchestrator-dashboard"
    owns_topics: ["dashboard", "cli", "status", "health", "metrics", "activity", "ui", "escalation-ui"]
    docker:
      port: 3473
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  claude-orchestrator-reviewer:
    dir: "claude-orchestrator-reviewer"
    repo: "git@github.com:rapartlu/claude-orchestrator-reviewer.git"
    pool: "reviewer"
    description: "Quality and oversight layer. PR reviewer, task verifier, supervisor, improvement detector, and escalation system (Telegram notifications). Also serves as the LLM backend for all orchestrator operations."
    capabilities: ["typescript", "llm", "review", "verification"]
    github: "rapartlu/claude-orchestrator-reviewer"
    owns_topics: ["review", "verification", "supervisor", "improvement", "escalation", "telegram", "quality"]
    docker:
      port: 3474
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  claude-orchestrator-reviewer-2:
    dir: "claude-orchestrator-reviewer"
    repo: "git@github.com:rapartlu/claude-orchestrator-reviewer.git"
    pool: "reviewer"
    description: "Reviewer pool instance 2. Shares LLM workload with other reviewer instances."
    capabilities: ["typescript", "llm", "review", "verification"]
    owns_topics: []
    docker:
      port: 3475
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  claude-orchestrator-reviewer-3:
    dir: "claude-orchestrator-reviewer"
    repo: "git@github.com:rapartlu/claude-orchestrator-reviewer.git"
    pool: "reviewer"
    description: "Reviewer pool instance 3. Shares LLM workload with other reviewer instances."
    capabilities: ["typescript", "llm", "review", "verification"]
    owns_topics: []
    docker:
      port: 3476
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

  claude-orchestrator-telegram:
    dir: "claude-agent-orchestrator"
    description: "Dedicated lightweight instance for Telegram command handling. Not for dispatched work — only serves quick queries (status, health, summary) without blocking on long tasks."
    capabilities: ["telegram", "status"]
    owns_topics: []
    docker:
      port: 3477
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "fresh"

  claude-proxy:
    dir: "claude-proxy"
    repo: "git@github.com:rapartlu/claude-proxy.git"
    description: "Development proxy server that wraps Claude Code CLI instances and exposes them via the Anthropic Messages API. Manages agent containers, Docker lifecycle, and multi-agent routing."
    capabilities: ["typescript", "docker", "proxy", "api", "infrastructure"]
    github: "rapartlu/claude-proxy"
    owns_topics: ["proxy", "docker", "container", "infrastructure", "auth", "ssh"]
    docker:
      port: 3471
      api_key: "cheese"
      permissions: "bypassPermissions"
      session: "continue"

