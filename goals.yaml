# Monthly goals — ambitious targets that give the fleet direction.
# The supervisor, roadmap proposer, and priority scorer use these
# to align work. Progress tracked via key results and Telegram reports.

month: 2026-06
goals:
  - id: parallel-subtask-execution
    title: Parallel subtask execution for complex issues
    target: 3 multi-subtask issues completed end-to-end with parallel agent coordination
    owner: orchestrator
    key_results:
      - description: Planner generates parallel subtask plans with dependency graphs for complex issues
        metric: parallel_plans_generated >= 10
      - description: Dispatcher creates and tracks parent/child task trees in state.db
        metric: parent_child_trees_tracked >= 5
      - description: At least one 4-agent parallel execution completes successfully end-to-end
        metric: max_parallel_agents_in_single_task >= 4
      - description: 3 multi-subtask issues closed with all child PRs merged
        metric: parallel_issues_completed >= 3
  - id: token-spend-reduction
    title: Cut token spend 50% via smart routing, caching, and cost attribution
    target: Same throughput at half the token cost with full per-tier visibility
    owner: system
    key_results:
      - description: Per-model token usage tracked and attributed to cost tier for every task
        metric: token_attribution_coverage >= 0.95
      - description: Token usage dashboard surfaces per-tier cost breakdown in real time
        metric: dashboard_cost_breakdown_live == true
      - description: Prompt cache hit rate reaches 40% or above across all LLM calls
        metric: prompt_cache_hit_rate >= 0.40
      - description: Total token spend per completed task drops 30% vs May baseline
        metric: tokens_per_task_reduction >= 0.30
  - id: scale-throughput-quality
    title: Scale to 1,000 tasks/week at sub-12% failure rate
    target: "Higher throughput AND higher reliability: 1000 tasks/week, failure_rate <= 0.12"
    owner: system
    key_results:
      - description: Weekly completed tasks reach 1,000 (up from ~776)
        metric: weekly_tasks_completed >= 1000
      - description: Task failure rate drops from 20% to below 12%
        metric: failure_rate <= 0.12
      - description: First-pass verification rate pushed from 80.1% to 85%
        metric: first_pass_verification_rate >= 0.85
      - description: Fleet expanded to 10 or more active agents
        metric: active_agents >= 10
  - id: meeting-facilitator-live
    title: Meeting facilitator agent live and handling real meetings
    target: Core logic shipped, 5+ meetings facilitated end-to-end with logged outcomes
    owner: orchestrator
    key_results:
      - description: Core meeting facilitator logic implemented, deployed, and passing CI
        metric: meeting_facilitator_deployed == true
      - description: At least 5 meetings facilitated end-to-end without operator intervention
        metric: meetings_facilitated >= 5
      - description: Meeting outcomes (agenda, decisions, action items) persisted to state.db
        metric: outcome_persistence_rate >= 0.90
