name: CI (self-hosted fallback)
# This workflow runs the same checks as ci.yml but only on workflow_dispatch.
# Use it to manually verify a branch when GitHub-hosted runner billing is exhausted.
#
# Usage:
#   gh workflow run ci-self-hosted.yml --repo rapartlu/agent-orchestrator \
#     --ref <branch-name>
#
# The job name intentionally matches the main CI job ("test") so that
# if branch protection is updated to accept this workflow's check, it will work.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to verify (defaults to current branch)"
        required: false
        default: ""

concurrency:
  group: ci-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Validate dependencies (cached)
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npm ci --prefer-offline

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
