<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents — Orchestrator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .badge-running { background: #065f46; color: #6ee7b7; }
    .badge-stopped { background: #7f1d1d; color: #fca5a5; }
    nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
    nav a:hover, nav a.active { color: #e2e8f0; background: #334155; }
    .stat-bar { height: 6px; border-radius: 3px; background: #334155; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen">
  <nav class="flex items-center gap-2 p-4 border-b border-gray-700">
    <span class="font-bold text-lg mr-4">Orchestrator</span>
    <a href="/">Dashboard</a>
    <a href="/tasks">Tasks</a>
    <a href="/agents" class="active">Agents</a>
    <a href="/logs">Logs</a>
  </nav>

  <div class="p-6 max-w-7xl mx-auto">
    <div class="grid grid-cols-2 gap-4" id="agent-grid"></div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/agents');
      const agents = await res.json();
      const grid = document.getElementById('agent-grid');

      grid.innerHTML = agents.map(a => {
        const successRate = a.stats.total > 0 ? ((a.stats.done / a.stats.total) * 100).toFixed(0) : 0;
        const scoreDisplay = a.stats.avg_score ? a.stats.avg_score.toFixed(2) : 'N/A';
        const statusClass = a.containerStatus === 'running' ? 'badge-running' : 'badge-stopped';

        return `
          <div class="card">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h3 class="font-bold text-blue-400">${a.name}</h3>
                <p class="text-gray-400 text-sm">${a.description}</p>
              </div>
              <span class="badge ${statusClass}">${a.containerStatus}</span>
            </div>
            <div class="text-xs text-gray-500 mb-3">
              ${a.capabilities.map(c => '<span class="bg-gray-700 rounded px-2 py-0.5 mr-1">' + c + '</span>').join('')}
            </div>
            <div class="grid grid-cols-3 gap-2 text-center text-sm mb-2">
              <div><div class="font-bold">${a.stats.total}</div><div class="text-gray-500 text-xs">tasks</div></div>
              <div><div class="font-bold text-green-400">${successRate}%</div><div class="text-gray-500 text-xs">success</div></div>
              <div><div class="font-bold text-yellow-400">${scoreDisplay}</div><div class="text-gray-500 text-xs">avg score</div></div>
            </div>
            <div class="stat-bar"><div class="stat-fill bg-green-500" style="width: ${successRate}%"></div></div>
            <div class="text-xs text-gray-500 mt-2">
              ${a.github ? '<a href="https://github.com/' + a.github + '" class="text-blue-400 hover:underline">' + a.github + '</a>' : ''}
              ${a.docker?.port ? ' · port ' + a.docker.port : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
