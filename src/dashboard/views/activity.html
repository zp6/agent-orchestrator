<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — Orchestrator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
    nav a:hover, nav a.active { color: #e2e8f0; background: #334155; }
    .message-card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .to-agent { border-left: 3px solid #3b82f6; }
    .from-agent { border-left: 3px solid #22c55e; }
    .system-msg { border-left: 3px solid #64748b; }
    .failed-task { opacity: 0.6; border-color: #991b1b; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .content-preview { max-height: 200px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
    .content-preview.expanded { max-height: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-to { background: #1e3a5f; color: #93c5fd; }
    .badge-from { background: #065f46; color: #6ee7b7; }
    .badge-system { background: #334155; color: #94a3b8; }
  </style>
</head>
<body class="min-h-screen">
  <nav class="flex items-center gap-2 p-4 border-b border-gray-700">
    <span class="font-bold text-lg mr-4">Orchestrator</span>
    <a href="/">Dashboard</a>
    <a href="/tasks">Tasks</a>
    <a href="/agents">Agents</a>
    <a href="/activity" class="active">Activity</a>
    <a href="/logs">Logs</a>
  </nav>

  <div class="p-6 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">Agent Activity Feed</h1>
      <select id="filter-agent" class="bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm">
        <option value="">All agents</option>
      </select>
    </div>

    <div id="activity-feed"></div>
  </div>

  <script>
    let allActivity = [];
    const feed = document.getElementById('activity-feed');
    const filterAgent = document.getElementById('filter-agent');

    async function load() {
      const res = await fetch('/api/activity?limit=100', { credentials: 'same-origin' });
      allActivity = await res.json();

      // Populate agent filter
      const agents = [...new Set(allActivity.map(a => a.agent_name).filter(Boolean))];
      const currentFilter = filterAgent.value;
      filterAgent.innerHTML = '<option value="">All agents</option>' +
        agents.map(a => `<option value="${a}" ${a === currentFilter ? 'selected' : ''}>${a}</option>`).join('');

      render();
    }

    function render() {
      const filter = filterAgent.value;
      const filtered = filter ? allActivity.filter(a => a.agent_name === filter) : allActivity;

      feed.innerHTML = filtered.map(entry => {
        const dirClass = entry.direction === 'to_agent' ? 'to-agent' :
          entry.direction === 'from_agent' ? 'from-agent' : 'system-msg';
        const badgeClass = entry.direction === 'to_agent' ? 'badge-to' :
          entry.direction === 'from_agent' ? 'badge-from' : 'badge-system';
        const dirLabel = entry.direction === 'to_agent' ? 'Orchestrator → Agent' :
          entry.direction === 'from_agent' ? 'Agent → Orchestrator' : 'System';
        const arrow = entry.direction === 'to_agent' ? '→' :
          entry.direction === 'from_agent' ? '←' : '★';

        const time = new Date(entry.created_at).toLocaleTimeString();
        const agent = entry.agent_name || 'unknown';
        const taskTitle = entry.task?.title || entry.task_id.slice(0, 8);
        const taskStatus = entry.task?.status || 'unknown';
        const verificationStatus = entry.task?.verification_status || null;
        const qualityScore = entry.task?.quality_score ?? null;
        const scoreStr = qualityScore !== null ? ` (${qualityScore.toFixed(1)})` : '';
        const statusBadge = taskStatus === 'failed'
          ? '<span style="background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">FAILED</span>'
          : (taskStatus === 'dispatched' || taskStatus === 'in_progress')
          ? '<span style="background:#1e3a5f;color:#93c5fd;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px;animation:pulse 2s infinite">IN PROGRESS</span>'
          : taskStatus === 'done' && verificationStatus === 'approved'
          ? `<span style="background:#065f46;color:#6ee7b7;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">✓ APPROVED${scoreStr}</span>`
          : taskStatus === 'done' && verificationStatus === 'rejected'
          ? `<span style="background:#7f1d1d;color:#fca5a5;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">✗ REJECTED${scoreStr}</span>`
          : taskStatus === 'done'
          ? '<span style="background:#065f46;color:#6ee7b7;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">DONE</span>'
          : taskStatus === 'planning'
          ? '<span style="background:#581c87;color:#d8b4fe;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">PLANNING</span>'
          : taskStatus === 'pending'
          ? '<span style="background:#713f12;color:#fcd34d;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px">PENDING</span>'
          : '';
        const tokens = (entry.tokens_in || entry.tokens_out)
          ? `<span class="text-gray-500 text-xs ml-2">${entry.tokens_in || 0} in / ${entry.tokens_out || 0} out</span>`
          : '';

        const contentId = 'content-' + entry.id;
        const content = escapeHtml(entry.content);
        const isLong = content.length > 500;

        return `
          <div class="message-card ${dirClass} ${taskStatus === 'failed' ? 'failed-task' : ''}">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="badge ${badgeClass}">${dirLabel}</span>
                <span class="text-blue-400 font-semibold ml-2">${agent}</span>
                ${tokens}
              </div>
              <span class="text-gray-500 text-xs">${time}</span>
            </div>
            <div class="text-gray-400 text-xs mb-2">${taskTitle}${statusBadge}</div>
            <div class="content-preview" id="${contentId}" data-full="${content.replace(/"/g, '&quot;')}">${isLong ? content.slice(0, 500) + '...' : content}</div>
            ${isLong ? `<button onclick="toggleExpand('${contentId}', this)" class="text-blue-400 text-xs mt-1 hover:underline">Show more</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleExpand(id, btn) {
      const el = document.getElementById(id);
      const fullContent = el.getAttribute('data-full');
      if (el.classList.contains('expanded')) {
        el.classList.remove('expanded');
        el.innerHTML = fullContent.slice(0, 500) + '...';
        btn.textContent = 'Show more';
      } else {
        el.classList.add('expanded');
        el.innerHTML = fullContent;
        btn.textContent = 'Show less';
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    filterAgent.addEventListener('change', render);
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
